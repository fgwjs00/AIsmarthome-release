name: "轻主机 AI 助手"
version: "0.3.16"
slug: "qing_ai_hub"
description: "全品牌智能家居 AI 场景与自动化创建调试、Zigbee 全协调器兼容与设备快速接入管理助手（默认通义千问）"
# 预构建商业二进制多架构镜像（阿里云杭州 ACR 国内高速直拉，自动适配 aarch64 与 amd64）
image: "crpi-sijm6r9k7e2benib.cn-hangzhou.personal.cr.aliyuncs.com/fgwjs00/qing_ai_hub"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-happy-outline"
panel_title: "AI 助手"
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
  - type: addons
    read_only: false
services:
  - "mqtt:want"
options:
  llm:
    provider: "qwen"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: ""
    model: "qwen-plus"
    max_tokens: 8192
    top_p: 0.7
    temperature: 0.2
    concise_reply: false
    history_turns: 3
  zigbee:
    stack: "auto"
    permit_duration: 120
  safety:
    auto_apply_low_risk: true
    require_confirm_l2: true
  cloud:
    enabled: false
    cloud_url: "https://cloud.tuojiayi.com"
    gateway_label: "轻主机"
  log_level: "info"
schema:
  llm:
    provider: "list(qwen|deepseek|doubao|kimi|custom)"
    base_url: "str?"
    api_key: "password?"
    model: "str?"
    max_tokens: "int(256,32000)"
    top_p: "float(0,1)"
    temperature: "float(0,2)"
    concise_reply: bool
    history_turns: "int(0,20)"
  zigbee:
    stack: "list(auto|zha|z2m)"
    permit_duration: "int(30,254)"
  safety:
    auto_apply_low_risk: bool
    require_confirm_l2: bool
  cloud:
    enabled: bool
    cloud_url: "url?"
    gateway_label: "str?"
  log_level: "list(debug|info|warning|error)"
